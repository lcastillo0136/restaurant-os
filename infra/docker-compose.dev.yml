# DESARROLLO únicamente. No exponer esta BD a internet ni usar contraseñas demo en producción.
name: ${COMPOSE_PROJECT_NAME:-restaurant-os-dev}

services:
  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 3000
      API_EXECUTION_MODE: docker
      API_ALLOWED_ORIGINS: ${API_ALLOWED_ORIGINS:-}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-restaurant_dev}
      POSTGRES_USER: ${POSTGRES_USER:-restaurant_dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${API_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/api/v1/system/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 15s
    networks:
      - restaurant_internal

  postgres:
    image: ${POSTGRES_IMAGE:-postgres:17}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-restaurant_dev}
      POSTGRES_USER: ${POSTGRES_USER:-restaurant_dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD in env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    networks:
      - restaurant_internal

volumes:
  postgres_data:

networks:
  restaurant_internal:
    driver: bridge
