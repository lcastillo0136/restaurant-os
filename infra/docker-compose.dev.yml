# DESARROLLO únicamente. No exponer esta BD a internet ni usar contraseñas demo en producción.
services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-restaurant_dev}
      POSTGRES_USER: ${POSTGRES_USER:-restaurant_dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD in env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      retries: 10
volumes:
  pgdev:
